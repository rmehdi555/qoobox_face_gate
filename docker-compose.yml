services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.arvancloud.ir/library/postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facegate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facegate}
      POSTGRES_DB: ${POSTGRES_DB:-facegate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facegate} -d ${POSTGRES_DB:-facegate}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.arvancloud.ir/library/python:3.12-slim-bookworm}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://facegate:facegate@postgres:5432/facegate}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-random-secret}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      FACE_RECOGNITION_THRESHOLD: ${FACE_RECOGNITION_THRESHOLD:-0.5}
      FACE_RECOGNITION_MODEL: ${FACE_RECOGNITION_MODEL:-buffalo_s}
      RECOGNITION_INTERVAL_MS: ${RECOGNITION_INTERVAL_MS:-500}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      MAX_AUDIO_UPLOAD_SIZE_MB: ${MAX_AUDIO_UPLOAD_SIZE_MB:-25}
      MAX_SESSION_UPLOAD_SIZE_MB: ${MAX_SESSION_UPLOAD_SIZE_MB:-200}
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_DOWNLOAD_ROOT: ${WHISPER_DOWNLOAD_ROOT:-/app/storage/whisper}
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage/faces}
      SESSION_STORAGE_PATH: ${SESSION_STORAGE_PATH:-/app/storage/sessions}
      INSIGHTFACE_HOME: ${INSIGHTFACE_HOME:-/app/storage/models}
      ONNX_EXECUTION_PROVIDERS: CPUExecutionProvider
      CUDA_VISIBLE_DEVICES: "-1"
      NVIDIA_VISIBLE_DEVICES: void
      NVIDIA_DRIVER_CAPABILITIES: ""
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - face_storage:/app/storage/faces
      - session_storage:/app/storage/sessions
      - insightface_models:/app/storage/models
      - whisper_models:/app/storage/whisper
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        NODE_IMAGE: ${NODE_IMAGE:-docker.arvancloud.ir/library/node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-docker.arvancloud.ir/library/nginx:1.27-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  face_storage:
  session_storage:
  insightface_models:
  whisper_models:
